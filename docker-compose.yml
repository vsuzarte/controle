name: financas

services:
  financas:
    build: .
    image: financas:latest
    container_name: financas
    restart: unless-stopped
    ports:
      # 0.0.0.0 = acessível pelo celular na rede de casa. Use "127.0.0.1:8080:8080" para só este PC.
      - "${PORTA:-8080}:8080"
    environment:
      Senha: ${SENHA:-}
      TZ: America/Sao_Paulo
    volumes:
      - ./dados:/data
      - ./backups:/backups
